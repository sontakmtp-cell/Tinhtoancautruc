    <noscript>
      <article>
        <h1>Công cụ Tính toán Dầm Cầu trục Online - Miễn phí theo TCVN 5575:2024</h1>
        <p>
          <strong>Crane Beam Design Studio</strong> là công cụ tính toán dầm cầu trục trực tuyến
          miễn phí cho kỹ sư kết cấu, sinh viên xây dựng và đơn vị thiết kế nhà xưởng công nghiệp
          tại Việt Nam. Công cụ hỗ trợ kiểm tra tải trọng, độ bền, độ võng, ổn định và mỏi của dầm
          cầu trục theo định hướng tiêu chuẩn TCVN 5575:2024 và TCVN 2737:2023. Trang này cung cấp
          dữ liệu đầu vào, kết quả kiểm tra và báo cáo kỹ thuật để hỗ trợ quá trình thiết kế sơ bộ.
        </p>

        <h2>Tính năng chính</h2>
        <ul>
          <li>Tính toán tải trọng cầu trục theo sức nâng, nhịp dầm và cấu hình bánh xe.</li>
          <li>Kiểm tra ứng suất uốn, cắt và ứng suất tương đương của dầm cầu trục.</li>
          <li>Kiểm tra ổn định tổng thể và ổn định cục bộ cho tiết diện thép.</li>
          <li>Kiểm tra độ võng đứng và độ võng ngang trong quá trình làm việc.</li>
          <li>Kiểm tra mỏi theo nhóm chế độ làm việc của cầu trục.</li>
          <li>Xuất báo cáo tính toán PDF để lưu trữ hoặc rà soát thiết kế.</li>
        </ul>

        <h2>Câu hỏi thường gặp</h2>
        <h3>Dầm cầu trục là gì?</h3>
        <p>
          Dầm cầu trục là cấu kiện kết cấu thép nằm ngang, đặt trên vai cột hoặc console cột nhà
          xưởng, có nhiệm vụ đỡ ray cầu trục và truyền tải trọng từ cầu trục xuống hệ khung chính.
        </p>

        <h3>Công cụ này tính toán theo tiêu chuẩn nào?</h3>
        <p>
          Công cụ được xây dựng để hỗ trợ kiểm tra dầm cầu trục theo định hướng TCVN 5575:2024 về
          kết cấu thép và TCVN 2737:2023 về tải trọng và tác động.
        </p>

        <h3>Công cụ tính toán dầm cầu trục này có miễn phí không?</h3>
        <p>
          Có. Crane Beam Design Studio tại cautruc.kythuatvang.com là công cụ trực tuyến miễn phí,
          dùng được ngay trên trình duyệt mà không cần cài phần mềm chuyên dụng.
        </p>
